name: Static validation

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run portable build configuration tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Parse PowerShell scripts
        shell: powershell
        run: .\tests\validate_powershell.ps1
      - name: Run DNI algorithm tests
        shell: powershell
        run: .\tests\test_algorithms.ps1
