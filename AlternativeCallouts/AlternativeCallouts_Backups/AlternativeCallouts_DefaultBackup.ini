// ===========================================================================
//  AlternativeCallouts - Pack de Llamadas con Minimo 5 Alternativas por Llamada
//  Cada llamada cuenta con 5 ramas aleatorias de resolucion:
//    0 = Cooperacion / Resolucion Pacifica / Mediacion reglamentaria
//    1 = Resistencia activa / Forcejeo / Arma blanca o puños
//    2 = Fuga a pie por callejones o azoteas (Persecucion a pie)
//    3 = Fuga en vehiculo / Persecucion a motor
//    4 = Giro critico mayor / Crimen encubierto (armas de fuego, rehenes, drogas)
//  Fijar 'ForceOutcome = -1' para aleatorio (20% por rama) o 0..4 para forzar.
// ===========================================================================

