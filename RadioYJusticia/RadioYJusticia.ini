; ==================================================================
; RadioYJusticia - Mod Nativo LSPDFR de Comunicaciones y Justicia
; ==================================================================

[General]
; Habilita o deshabilita la totalidad del mod (true / false)
ModEnabled=true

[Teclas]
; Tecla para desplegar el Menu de Radio SIRDEE / TETRA (Multiply = NumPad *)
RadioKey=Multiply
; Tecla para activar el Boton de Panico 10-99 (Subtract = NumPad -)
PanicKey=Subtract

[Radio]
; Intervalo promedio en segundos entre transmisiones de radio ambiental (60 - 120 seg)
ChatterIntervalSeconds=90

[TiemposJudiciales]
; Minutos reales de juego para completar el ciclo legal de custodia policial de 72 horas
; (2 minutos reales = 72 horas procesales completas hasta pasar al Juez de Guardia)
JudicialSpeedMinutes=2
