[General]
ModEnabled=true
Idioma=ES

[Teclas]
; Tecla para abrir el Menú de Intervención Policial
InterventionKey=F9
; Tecla para abrir el Terminal SITEL / DGT
MdtKey=F10
; Tecla para abrir el menú de Refuerzos SIRDEE
BackupKey=Insert

[Alcoholimetro]
; Probabilidad (0-100) de que un conductor dé positivo en alcoholemia
ProbabilidadPositivo=30
; Probabilidad de que sea penal (>0.60 mg/l) si da positivo
ProbabilidadPenal=40

[Drogas]
; Probabilidad base (0-100) de positivo en cada sustancia del test
ProbabilidadTHC=15
ProbabilidadCocaina=10
ProbabilidadOpiaceos=5
ProbabilidadAnfetaminas=8

[Refuerzos]
; Tiempo de respuesta en segundos para cada unidad
TiempoPatrullaZeta=15
TiempoATGC=25
TiempoUPR=30
TiempoGEO=45
TiempoK9=35
TiempoHelicoptero=40
TiempoGrua=60
TiempoAmbulancia=30
TiempoCientifica=45

[Balistica]
; Duración en segundos del efecto NMI del Taser
DuracionTaserNMI=5
; Puntos de vida que absorben las placas balísticas antes de romperse
ResistenciaPlacas=50
; Duración en segundos del efecto del spray de pimienta
DuracionSprayPimienta=8

[Censo]
; Probabilidad (0-100) de que un ciudadano tenga antecedentes penales
ProbabilidadAntecedentes=15
; Probabilidad (0-100) de que un ciudadano tenga una requisitoria judicial
ProbabilidadRequisitoria=8

[ServiciosAmbientales]
; Activar tráfico ambiental de patrullas, ambulancias SAMUR, coches fúnebres, bomberos y grúas
AmbientServicesEnabled=true
; Intervalo mínimo y máximo en segundos entre servicios simulados
IntervaloMinSegundos=45
IntervaloMaxSegundos=75
; Activar o desactivar tipos individuales de vehículos ambientales
HabilitarPatrullasPolicia=true
HabilitarAmbulanciasSAMUR=true
HabilitarCochesFunebres=true
HabilitarBomberos=true
HabilitarGruasMunicipales=true
