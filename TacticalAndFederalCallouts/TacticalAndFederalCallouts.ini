; =============================================================================
; TACTICAL & FEDERAL CALLOUTS (LSPDFR) - CONFIGURACION MAESTRA
; =============================================================================

[General]
; Habilita o deshabilita la totalidad del plugin (true/false)
ModEnabled=true

; Multiplicador global de probabilidad para las llamadas (0.1 a 5.0)
GlobalCalloutChanceMultiplier=1.0

; Solicitar automaticamente refuerzos SWAT/NOOSE al aceptar llamadas tacticas
AutoSwatBackup=true

; Solicitar apoyo aereo (helicoptero policial) en operaciones de alta cota
AutoAirSupport=true

; Punteria de los sospechosos (1 a 100). Valor por defecto recomendado: 60
SuspectAccuracy=60

