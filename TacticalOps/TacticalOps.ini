[General]
// Habilitar o deshabilitar el mod TacticalOps (true / false)
ModEnabled=true

// Frecuencia en segundos del dano por sangrado activo (1 HP cada X segundos)
BleedDamageRate=3

// Maximo de objetos de escena desplegables simultaneamente
MaxProps=30

[Teclas]
// Tecla para abrir el Menu de Gestion de Escenas (Default: Home)
SceneKey=Home

// Tecla para abrir el Menu de Primeros Auxilios IFAK / TCCC (Default: End)
MedicalKey=End

// Tecla para abrir el Menu de Entrada Tactica CQB (Default: PageDown)
CqbKey=PageDown

[CQB]
// Duracion del aturdimiento por granada Flashbang en segundos
FlashbangStunDuration=5

// Radio de dano de la brecha explosiva lineal en metros
ExplosiveDamageRadius=3.0

[Negociacion]
// Nivel inicial de tension del sospechoso (0 a 100)
InitialTension=50

// Nivel maximo de tension antes de que el sospechoso abra fuego o ejecute rehenes
MaxTension=100
