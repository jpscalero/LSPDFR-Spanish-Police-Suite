; ============================================================================
;                     POLICE LIFE SYSTEM - CONFIGURACIÓN                      
;             Mod de Carrera, Economía y Documentación Policial (CNP)         
; ============================================================================

[General]
; Habilitar o deshabilitar el plugin
ModEnabled=true
; Intervalo de cobro de nómina en minutos de juego (48 minutos = 1 día completo en GTA V)
SalaryIntervalMinutes=48

[Teclas]
; Tecla para abrir el Menú General de Carrera, Tienda y Estadísticas (Por defecto: Add / NumPad +)
MenuKey=Add
; Tecla para abrir el Menú de Documentación Policial y Atestados (Por defecto: Divide / NumPad /)
DocsKey=Divide

[Salarios]
; Sueldos base mensuales en euros (€) según rango oficial del CNP
BaseSalaryAlumno=1800
BaseSalaryPolicia=2100
BaseSalaryOficial=2400
BaseSalarySubinspector=2800
BaseSalaryInspector=3300
BaseSalaryInspectorJefe=3900
BaseSalaryComisario=4500
; Porcentaje de plus por turno de noche (22:00 a 06:00 horas)
NightBonusPercent=30
; Coste mensual del alquiler
RentCost=600
; Coste de carburante por turno de patrulla
FuelCost=50

[XP]
; Multiplicador global de experiencia
XPMultiplier=1.0
; Días de juego entre homenajes en la Comisaría Central (1-365)
CelebrationIntervalDays=7
